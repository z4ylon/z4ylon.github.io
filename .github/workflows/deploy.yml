name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Recompila a diario para que la agenda de Bandsintown esté al día aunque no haya cambios
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v6
         with:
            enablement: true

      - run: npm ci

      - run: npm run build
        env:
          # Dominio y subdirectorio que asigna GitHub Pages (usuario.github.io/repositorio o dominio propio)
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Demo: que los buscadores no la indexen. Quitar al publicar la versión oficial.
          PUBLIC_NOINDEX: 'true'
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
